<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Text Blocks</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #fafafa;
      min-height: 100vh;
      overflow: hidden;
      color: #111111;
    }

    /* Simple Flat Text Block */
    .card {
      position: absolute;
      width: 260px;
      padding: 24px 20px 20px 20px;
      background: #ffffff;
      border: 2px solid #111111;
      box-shadow: 6px 6px 0px #111111;
      user-select: none;
    }

    /* Drag Area: Top edge of the box */
    .drag-handle {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 20px;
      cursor: grab;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    /* Content Styling */
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    h2 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    p, li {
      font-size: 0.9rem;
      line-height: 1.5;
    }

    a {
      color: #111111;
    }

    ul {
      list-style-position: inside;
    }
  </style>
</head>
<body>

  <div class="site-container">

    <header class="card draggable" style="top: 60px; left: 60px;">
      <div class="drag-handle"></div>
      <h1>Jane Doe</h1>
      <p>Designer & Developer</p>
    </header>
    
    <section class="card draggable" style="top: 60px; left: 360px;">
      <div class="drag-handle"></div>
      <h2>About</h2>
      <p>Building minimal web spaces and simple layouts.</p>
    </section>

    <section class="card draggable" style="top: 220px; left: 360px;">
      <div class="drag-handle"></div>
      <h2>Projects</h2>
      <ul>
        <li><a href="#">Project Alpha</a></li>
        <li><a href="#">Project Beta</a></li>
      </ul>
    </section>

    <section class="card draggable" style="top: 200px; left: 60px;">
      <div class="drag-handle"></div>
      <h2>Contact</h2>
      <p><a href="mailto:hello@example.com">hello@example.com</a></p>
    </section>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let highestZIndex = 10;

      document.querySelectorAll('.draggable').forEach(card => {
        // Only target the top drag-handle area
        const handle = card.querySelector('.drag-handle');
        let isDragging = false;
        let offsetX = 0;
        let offsetY = 0;

        // Bring to front on any click inside the box
        card.addEventListener('mousedown', () => {
          highestZIndex++;
          card.style.zIndex = highestZIndex;
        });

        // Drag action triggers ONLY from the top handle
        handle.addEventListener('mousedown', (e) => {
          isDragging = true;
          offsetX = e.clientX - card.getBoundingClientRect().left;
          offsetY = e.clientY - card.getBoundingClientRect().top;
        });

        document.addEventListener('mousemove', (e) => {
          if (!isDragging) return;
          card.style.left = `${e.clientX - offsetX}px`;
          card.style.top = `${e.clientY - offsetY}px`;
        });

        document.addEventListener('mouseup', () => {
          isDragging = false;
        });
      });
    });
  </script>
</body>
</html>
