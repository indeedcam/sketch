<body>
<script> let highestZIndex = 10;

document.querySelectorAll('.draggable').forEach(card => {
  const header = card.querySelector('.card-header') || card;
  let isDragging = false;
  let offsetX = 0;
  let offsetY = 0;

  header.addEventListener('mousedown', (e) => {
    isDragging = true;
    
    // Bring clicked card to top
    highestZIndex++;
    card.style.zIndex = highestZIndex;

    // Calculate mouse offset inside the card
    offsetX = e.clientX - card.getBoundingClientRect().left;
    offsetY = e.clientY - card.getBoundingClientRect().top;
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;

    // Move card position relative to viewport
    card.style.left = `${e.clientX - offsetX}px`;
    card.style.top = `${e.clientY - offsetY}px`;
  });

  document.addEventListener('mouseup', () => {
    isDragging = false;
  });
});
</script>
</body>
<style>
  * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: system-ui, -apple-system, sans-serif;
  background-color: #f4f4f5;
  min-height: 100vh;
  overflow: hidden; /* Prevents scrollbars when dragging near edges */
}

/* Card Styling */
.card {
  position: absolute; /* Required for dragging */
  width: 280px;
  background: #ffffff;
  border: 2px solid #111111;
  border-radius: 8px;
  box-shadow: 4px 4px 0px #111111;
  user-select: none;
}

/* Drag Handle Header */
.card-header {
  padding: 8px 12px;
  background: #111111;
  color: #ffffff;
  font-weight: bold;
  font-size: 0.85rem;
  cursor: grab;
  border-top-left-radius: 5px;
  border-top-right-radius: 5px;
}

.card-header:active {
  cursor: grabbing;
}

.card-body {
  padding: 16px;
}

a {
  color: #111111;
}
</style>
