<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windows 95 Desktop</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "MS Sans Serif", Tahoma, sans-serif;
      background-color: #008080; /* Classic Win95 Teal */
      min-height: 100vh;
      overflow: hidden;
      color: #000000;
    }

    /* Windows 95 Outer Frame (Beveled 3D Border) */
    .card {
      position: absolute;
      width: 280px;
      background: #c0c0c0;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #000000;
      border-bottom: 2px solid #000000;
      box-shadow: inset -1px -1px 0px #808080, inset 1px 1px 0px #dfdfdf;
      padding: 3px;
      user-select: none;
    }

    /* Title Bar (Drag Handle) */
    .window-header {
      background: linear-gradient(90deg, #000080, #1084d0);
      color: #ffffff;
      padding: 3px 4px;
      font-weight: bold;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: grab;
    }

    .window-header:active {
      cursor: grabbing;
    }

    .title-left {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .window-icon {
      font-size: 10px;
    }

    /* Window Controls (Minimize, Maximize, Close) */
    .window-controls {
      display: flex;
      gap: 2px;
    }

    .win-btn {
      width: 16px;
      height: 14px;
      background: #c0c0c0;
      border-top: 1px solid #ffffff;
      border-left: 1px solid #ffffff;
      border-right: 1px solid #000000;
      border-bottom: 1px solid #000000;
      font-size: 9px;
      font-weight: bold;
      line-height: 12px;
      text-align: center;
      color: #000000;
      cursor: pointer;
    }

    .win-btn:active {
      border-top: 1px solid #000000;
      border-left: 1px solid #000000;
      border-right: 1px solid #ffffff;
      border-bottom: 1px solid #ffffff;
      padding: 1px 0 0 1px;
    }

    /* Window Body Container */
    .card-body {
      padding: 12px;
      background: #c0c0c0;
      font-size: 12px;
      line-height: 1.4;
    }

    /* Recessed Inset Area for Content */
    .inset-box {
      background: #ffffff;
      border-top: 2px solid #808080;
      border-left: 2px solid #808080;
      border-right: 2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      padding: 8px;
      margin-top: 4px;
    }

    h1 {
      font-size: 14px;
      margin-bottom: 4px;
    }

    h2 {
      font-size: 11px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    a {
      color: #000080;
    }

    ul {
      list-style-position: inside;
    }
  </style>
</head>
<body>

  <div class="site-container">

    <!-- Profile Window -->
    <header class="card draggable" style="top: 40px; left: 40px;">
      <div class="window-header">
        <div class="title-left">
          <span class="window-icon">👤</span>
          <span>Profile.exe</span>
        </div>
        <div class="window-controls">
          <button class="win-btn">_</button>
          <button class="win-btn">□</button>
          <button class="win-btn close-btn">✕</button>
        </div>
      </div>
      <div class="card-body">
        <h1>Jane Doe</h1>
        <p>Designer & Developer</p>
      </div>
    </header>
    
    <!-- About Window -->
    <section class="card draggable" style="top: 40px; left: 340px;">
      <div class="window-header">
        <div class="title-left">
          <span class="window-icon">📝</span>
          <span>About.txt</span>
        </div>
        <div class="window-controls">
          <button class="win-btn">_</button>
          <button class="win-btn">□</button>
          <button class="win-btn close-btn">✕</button>
        </div>
      </div>
      <div class="card-body">
        <div class="inset-box">
          <p>Building nostalgic digital spaces and fun web components.</p>
        </div>
      </div>
    </section>

    <!-- Projects Window -->
    <section class="card draggable" style="top: 210px; left: 340px;">
      <div class="window-header">
        <div class="title-left">
          <span class="window-icon">📁</span>
          <span>Projects</span>
        </div>
        <div class="window-controls">
          <button class="win-btn">_</button>
          <button class="win-btn">□</button>
          <button class="win-btn close-btn">✕</button>
        </div>
      </div>
      <div class="card-body">
        <ul>
          <li><a href="#">Project_Alpha.lnk</a></li>
          <li><a href="#">Project_Beta.lnk</a></li>
        </ul>
      </div>
    </section>

    <!-- Contact Window -->
    <section class="card draggable" style="top: 200px; left: 40px;">
      <div class="window-header">
        <div class="title-left">
          <span class="window-icon">🌐</span>
          <span>Contact.html</span>
        </div>
        <div class="window-controls">
          <button class="win-btn">_</button>
          <button class="win-btn">□</button>
          <button class="win-btn close-btn">✕</button>
        </div>
      </div>
      <div class="card-body">
        <p><a href="mailto:hello@example.com">hello@example.com</a></p>
      </div>
    </section>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let highestZIndex = 10;

      document.querySelectorAll('.draggable').forEach(card => {
        const header = card.querySelector('.window-header');
        const closeBtn = card.querySelector('.close-btn');
        let isDragging = false;
        let offsetX = 0;
        let offsetY = 0;

        // Bring window to top when clicked anywhere inside
        card.addEventListener('mousedown', () => {
          highestZIndex++;
          card.style.zIndex = highestZIndex;
        });

        // Dragging ONLY happens when grabbing the blue header bar
        header.addEventListener('mousedown', (e) => {
          // Ignore if clicking control buttons
          if (e.target.classList.contains('win-btn')) return;

          isDragging = true;
          offsetX = e.clientX - card.getBoundingClientRect().left;
          offsetY = e.clientY - card.getBoundingClientRect().top;
        });

        document.addEventListener('mousemove', (e) => {
          if (!isDragging) return;
          card.style.left = `${e.clientX - offsetX}px`;
          card.style.top = `${e.clientY - offsetY}px`;
        });

        document.addEventListener('mouseup', () => {
          isDragging = false;
        });

        // Close window functionality
        if (closeBtn) {
          closeBtn.addEventListener('click', () => {
            card.style.display = 'none';
          });
        }
      });
    });
  </script>
</body>
</html>
